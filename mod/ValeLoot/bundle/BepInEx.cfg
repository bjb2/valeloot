## The only BepInEx setting ValeLoot ships, and why.
##
## BepInEx writes the rest of this file itself on the first run; anything not named here keeps its
## stock default. Delete the file and you get stock BepInEx back on the next launch. This ships ONLY
## in the "with BepInEx" download — an existing BepInEx install's own config is never touched.

[Logging]

## Whether the GAME's Unity log is mirrored into BepInEx's console and LogOutput.log. Off.
##
## SpiritVale's netcode (FishNet) warns every time a message references a NetworkObject this client
## cannot see:
##
##   Spawned NetworkObject was expected to exist but does not for Id 56828.
##
## It is normal and it is not ValeLoot: a unit near you casts at a target outside your visibility,
## and FishNet says so once per cast, per spawn, per sync. Standing still — at a storage NPC, in a
## town, anywhere busy — that can be hundreds of identical lines a second, all naming the same id.
##
## Vanilla already logs every one of them; they go to Unity's own Player.log, which nobody reads.
## What BepInEx adds is a console, and a console line is a SYNCHRONOUS write, so the same harmless
## warning that cost nothing in vanilla now costs frames. Turning the mirror off is the whole fix.
##
## Nothing is lost. Unity keeps writing them, with full stack traces, to your user folder's
##   AppData\LocalLow\Baikun\SpiritVale\Player.log
## and ValeLoot's own lines never came from Unity's log in the first place — the console and
## LogOutput.log still say exactly what the mod resolved at boot, which is the log an issue needs.
##
## Set this back to true if you are debugging the GAME rather than the mod.
UnityLogListening = false
